name: okflint

on:
  pull_request:
  push:

jobs:
  validate-okf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Verify pinned OKF v0.2 compatibility corpus
        run: pnpm --dir apps/web test:okf-compatibility

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install okflint==0.3.1 beartype PyYAML

      - name: Validate OKF bundle
        run: okflint validate --manifest okf-base.yaml

      - name: Validate OKF typed relations
        run: python tools/okf_relation_lint.py --manifest okf-base.yaml
