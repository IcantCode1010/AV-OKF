okf_version: "0.2"
base:
  name: AV-OKF Knowledge Bundle
  roots:
    - path: knowledge
      exclude_patterns:
        - "**/.DS_Store"
        - "**/README.md"
  reserved_files:
    index: index.md
    log: log.md
  status_field: status
relations:
  allowed:
    - routes_to
    - references
    - supports
    - covered_by
    - supersedes
    - conflicts_with
    - depends_on
profile:
  date_fields:
    - stale_after
  types:
    index:
      required:
        - type
        - title
        - okf_version
    reference:
      required:
        - type
        - title
        - resource
    system_topic:
      required:
        - type
        - title
      optional:
        - description
        - status
        - generated
        - verified
        - sources
        - source_pages
        - tags
        - stale_after
        - knowledge_version
        - relations
        - av_okf_approval_mode
        - av_okf_lifecycle
        - subject_family
        - document_type
        - classification_code
        - effectivity
        - revision
  unknown_fields: warn
